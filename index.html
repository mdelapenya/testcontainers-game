<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Testcontainers: The Game — Spin · Test · Clean · Repeat</title>
<meta name="description" content="A three-level browser game about Testcontainers: nail your wait strategies, manage a container budget, and load the whale without sinking it." />
<meta name="color-scheme" content="dark" />

<style>
/* ---- design tokens (pulled from the box art) ---- */
:root {
  --navy-900: #081a2e;
  --navy-800: #0a1f36;
  --navy-700: #0e2a47;
  --navy-600: #14375c;
  --cream:    #f7f1e3;
  --sea:      #2a9cc9;
  --whale:    #3f7fd6;
  --teal:     #2ec4b6;
  --green:    #3bb273;
  --orange:   #e8833a;
  --purple:   #8a6bbd;
  --red:      #e05263;
  --amber:    #f4b942;
  --slate:    #7d95ab;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --ring: 0 0 0 3px rgba(46, 196, 182, .55);
  --ease: 220ms cubic-bezier(.2, .7, .3, 1);

  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%, #17436d 0%, transparent 60%),
    var(--navy-900);
  color: var(--cream);
  font-family: var(--font);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: var(--space-5) var(--space-4) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---- top bar ---- */
.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: var(--space-3); }

.cube {
  width: 34px; height: 34px;
  flex: none;
  background:
    linear-gradient(135deg, var(--teal) 0 50%, var(--whale) 50% 100%);
  clip-path: polygon(50% 0, 100% 27%, 100% 73%, 50% 100%, 0 73%, 0 27%);
}

.brand h1 {
  font-size: clamp(1.15rem, 3.2vw, 1.6rem);
  margin: 0;
  letter-spacing: -.02em;
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.brand em {
  font-style: normal;
  font-size: .62em;
  font-weight: 400;
  color: var(--slate);
}

.levelnav {
  display: flex;
  gap: var(--space-2);
  margin-left: auto;
  flex-wrap: wrap;
}

.levelnav button {
  font: inherit;
  font-size: .82rem;
  color: var(--cream);
  background: rgba(255, 255, 255, .06);
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 999px;
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: background var(--ease), border-color var(--ease), transform var(--ease);
}

.levelnav button:hover:not(:disabled) { background: rgba(255, 255, 255, .13); transform: translateY(-1px); }
.levelnav button[aria-current="true"] { background: var(--teal); border-color: var(--teal); color: var(--navy-900); font-weight: 600; }
.levelnav button:disabled { opacity: .4; cursor: not-allowed; }

.icon-btn {
  font: inherit;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  color: var(--cream);
  background: rgba(255, 255, 255, .06);
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 50%;
  cursor: pointer;
  transition: background var(--ease);
}

.icon-btn:hover { background: rgba(255, 255, 255, .13); }
.icon-btn[aria-pressed="false"] { opacity: .45; }

:where(button, a, canvas):focus-visible {
  outline: none;
  box-shadow: var(--ring);
  border-radius: var(--radius-sm);
}

/* ---- stage ---- */
.stage {
  position: relative;
  /* The HUD floats over a canvas that scales with the stage; sizing it in cqi
     keeps the two in step. In fixed px it stayed the same size as the board
     shrank and ended up sitting on top of the canvas chrome on a phone. */
  container-type: inline-size;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--navy-800);
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
}

.stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: manipulation;
}

.hud {
  position: absolute;
  inset: 1.7cqi 1.7cqi auto;
  display: flex;
  align-items: center;
  gap: 1.2cqi;
  pointer-events: none;
}

.hud-spacer { flex: 1; }

.pill {
  font-size: 1.3cqi;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 0.55cqi 1.5cqi;
  border-radius: 999px;
  background: rgba(8, 26, 46, .72);
  border: 1px solid rgba(255, 255, 255, .16);
  backdrop-filter: blur(6px);
}

.pill-level { color: var(--teal); }
.pill-lives { color: var(--red); letter-spacing: .1em; }

/* ---- overlay ---- */
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--space-5);
  background: rgba(8, 26, 46, .82);
  backdrop-filter: blur(3px);
  text-align: center;
}

.overlay[hidden] { display: none; }

.card {
  max-width: 560px;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  align-items: center;
}

.card h2 {
  margin: 0;
  font-size: clamp(1.3rem, 4vw, 2rem);
  letter-spacing: -.02em;
}

.card .eyebrow {
  margin: 0;
  font-size: .74rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--teal);
}

.card p { margin: 0; color: #dbe6f0; font-size: clamp(.88rem, 2.4vw, 1rem); }
.card p.small { font-size: .82rem; color: var(--slate); }

.card .takeaway {
  border-left: 3px solid var(--amber);
  padding-left: var(--space-3);
  text-align: left;
  color: var(--amber);
  font-size: .88rem;
}

.card .stats {
  display: flex;
  gap: var(--space-5);
  justify-content: center;
  flex-wrap: wrap;
  margin: var(--space-1) 0;
}

.card .stats div { display: flex; flex-direction: column; }
.card .stats b { font-size: 1.5rem; line-height: 1.1; }
.card .stats span { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--slate); }

.btn {
  font: inherit;
  font-weight: 600;
  color: var(--navy-900);
  background: var(--teal);
  border: 0;
  border-radius: 999px;
  padding: var(--space-3) var(--space-5);
  cursor: pointer;
  transition: transform var(--ease), filter var(--ease);
}

.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--cream); border: 1px solid rgba(255, 255, 255, .28); }
.btn.ghost:hover { background: rgba(255, 255, 255, .1); }

.btn-row { display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center; }

/* ---- touch controls ---- */
.touchbar {
  display: flex;
  gap: var(--space-2);
  justify-content: center;
  flex-wrap: wrap;
}

.touchbar[hidden] { display: none; }

.touchbar button {
  font: inherit;
  font-weight: 600;
  font-size: .85rem;
  color: var(--cream);
  background: rgba(255, 255, 255, .08);
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  min-width: 74px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
}

.touchbar button:active { background: var(--teal); color: var(--navy-900); }

/* ---- how to ---- */
.howto h2 {
  font-size: .78rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--slate);
  margin: 0 0 var(--space-3);
}

.howto-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-3);
}

.howto-grid article {
  background: rgba(255, 255, 255, .05);
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}

.howto-grid h3 { margin: 0 0 var(--space-2); font-size: .95rem; }
.howto-grid h3 span { color: var(--teal); }
.howto-grid p { margin: 0; font-size: .85rem; color: #c5d4e2; }
.howto-grid article[data-locked="true"] { opacity: .5; }

.keys { font-size: .82rem; color: var(--slate); margin: var(--space-4) 0 0; }

kbd {
  font-family: var(--mono);
  font-size: .78rem;
  background: rgba(255, 255, 255, .1);
  border: 1px solid rgba(255, 255, 255, .2);
  border-bottom-width: 2px;
  border-radius: var(--radius-sm);
  padding: 1px 6px;
  margin: 0 2px;
}

footer { color: var(--slate); font-size: .8rem; text-align: center; }
footer a { color: var(--teal); }

@media (max-width: 620px) {
  .app { padding: var(--space-4) var(--space-3) var(--space-5); gap: var(--space-4); }
  .levelnav { margin-left: 0; width: 100%; }
  .levelnav button { flex: 1; }
}

/* Phones: the 16:9 board is tiny in portrait, so point at the fix and, in
   landscape, let the board take the whole viewport height. */
.rotate-hint { display: none; }

@media (orientation: portrait) and (max-width: 620px) {
  .rotate-hint {
    display: block;
    margin: 0;
    text-align: center;
    font-size: .8rem;
    color: var(--slate);
  }
}

@media (orientation: landscape) and (max-height: 620px) {
  .app { padding: var(--space-3) var(--space-4) var(--space-4); gap: var(--space-3); }
  .brand h1 { font-size: 1rem; }
  .brand em { display: none; }

  /* One header row only: a wrapped top bar used to push the board off-screen. */
  .topbar { flex-wrap: nowrap; gap: var(--space-3); }
  .levelnav { flex-wrap: nowrap; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .levelnav button { flex: none; white-space: nowrap; }
  .icon-btn { flex: none; }

  /* Board on the left, touch buttons stacked beside it: a landscape phone has
     spare width but no spare height. */
  main {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    flex-wrap: wrap;
  }

  .stage {
    width: min(100%, calc((100dvh - 112px) * 16 / 9));
    height: auto;
    margin-inline: auto;
  }

  .touchbar { flex-direction: column; flex-wrap: nowrap; }
  .touchbar button { min-width: 88px; padding: var(--space-2) var(--space-3); }

  .howto { flex-basis: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .btn:hover, .levelnav button:hover { transform: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="cube" aria-hidden="true"></span>
      <h1>Testcontainers <em>the game</em></h1>
    </div>
    <nav class="levelnav" id="levelnav" aria-label="Levels"></nav>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" title="Toggle sound">
      <span aria-hidden="true">♪</span><span class="sr-only">Toggle sound</span>
    </button>
  </header>

  <main>
    <div class="stage" id="stage">
      <canvas id="game" width="960" height="540" aria-label="Game board. Full instructions and controls are listed below the board."></canvas>

      <div class="hud" aria-hidden="true">
        <span class="pill pill-level" id="hudLevel">Level 1</span>
        <span class="hud-spacer"></span>
        <span class="pill" id="hudScore">0</span>
        <span class="pill pill-lives" id="hudLives">♥♥♥</span>
      </div>

      <div class="overlay" id="overlay"></div>
      <p class="sr-only" id="live" role="status" aria-live="polite"></p>
    </div>

    <p class="rotate-hint">Turn your phone sideways for a bigger board.</p>

    <div class="touchbar" id="touchbar" hidden></div>

    <section class="howto">
      <h2>How to play</h2>
      <div class="howto-grid" id="howtoGrid"></div>
      <p class="keys">
        Keys: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> pick or spin ·
        <kbd>Space</kbd> act · <kbd>←</kbd><kbd>→</kbd> move ·
        <kbd>P</kbd> pause · <kbd>R</kbd> restart level
      </p>
    </section>
  </main>

  <footer>
    <p>Build · Test · Ship — a fan game about <a href="https://testcontainers.com" rel="noopener">Testcontainers</a>. Your progress is stored locally in this browser.</p>
  </footer>
</div>
<script>
const __modules = {};
const __cache = {};
function __require(id) {
  if (!(id in __cache)) __cache[id] = __modules[id]();
  return __cache[id];
}

__modules['src/rng.js'] = () => {
/** Deterministic PRNG so runs can be seeded (and tested). */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randomSeed() {
  return (Math.random() * 2 ** 32) >>> 0;
}

/** Uniform float in [min, max). */
function range(rng, min, max) {
  return min + rng() * (max - min);
}

/** Integer in [min, max]. */
function rangeInt(rng, min, max) {
  return Math.floor(range(rng, min, max + 1));
}

function pick(rng, list) {
  return list[Math.min(list.length - 1, Math.floor(rng() * list.length))];
}

return { mulberry32, randomSeed, range, rangeInt, pick };
};

__modules['src/draw.js'] = () => {
/** Shared canvas art: palette, primitives and the cast (containers, whale, gull). */

const C = {
  navy:      '#0e2a47',
  navyDeep:  '#081a2e',
  cream:     '#f7f1e3',
  sky1:      '#bfe3f6',
  sky2:      '#ecf7fd',
  sea:       '#2a9cc9',
  seaDeep:   '#1b7fa8',
  seaDark:   '#13607f',
  whale:     '#3f7fd6',
  whaleDark: '#2f66b5',
  whaleLite: '#8ab8ee',
  teal:      '#2ec4b6',
  green:     '#3bb273',
  orange:    '#e8833a',
  purple:    '#8a6bbd',
  red:       '#e05263',
  amber:     '#f4b942',
  slate:     '#7d95ab',
  white:     '#ffffff',
  ink:       '#12263a',
};

const FONT = '"Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

/** The cast. The first three carry levels 2 and 3; the rest visit level 1. */
const SERVICES = {
  postgres: { label: 'postgres', short: 'PG', color: C.teal,   port: 5432 },
  redis:    { label: 'redis',    short: 'RD', color: C.orange, port: 6379 },
  kafka:    { label: 'kafka',    short: 'KF', color: C.purple, port: 9092 },
  nginx:    { label: 'nginx',    short: 'NX', color: C.green,  port: 80 },
  keycloak: { label: 'keycloak', short: 'KC', color: C.whale,  port: 8080 },
  mysql:    { label: 'mysql',    short: 'MY', color: C.amber,  port: 3306 },
};

function roundRect(ctx, x, y, w, h, r) {
  const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function text(ctx, str, x, y, opts = {}) {
  const {
    size = 16, weight = 600, color = C.cream, align = 'left',
    baseline = 'alphabetic', font = FONT, alpha = 1, letterSpacing = null,
  } = opts;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (letterSpacing && 'letterSpacing' in ctx) ctx.letterSpacing = letterSpacing;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function panel(ctx, x, y, w, h, opts = {}) {
  const { fill = 'rgba(8,26,46,.72)', stroke = 'rgba(255,255,255,.16)', radius = 12, lineWidth = 1, alpha = 1 } = opts;
  ctx.save();
  ctx.globalAlpha = alpha;
  roundRect(ctx, x, y, w, h, radius);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }
  ctx.restore();
}

function meter(ctx, x, y, w, h, value, opts = {}) {
  const { color = C.teal, track = 'rgba(255,255,255,.14)', radius = h / 2, danger = 1.01 } = opts;
  const v = Math.max(0, Math.min(1, value));
  ctx.save();
  roundRect(ctx, x, y, w, h, radius);
  ctx.fillStyle = track;
  ctx.fill();
  if (v > 0) {
    roundRect(ctx, x, y, Math.max(h, w * v), h, radius);
    ctx.fillStyle = v >= danger ? C.red : color;
    ctx.fill();
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ */
/* Scenery                                                             */
/* ------------------------------------------------------------------ */

function drawSky(ctx, w, h, horizon) {
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, C.sky1);
  g.addColorStop(1, C.sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, horizon);
}

function drawClouds(ctx, t, w, horizon) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  const clouds = [
    { x: 0.12, y: 0.22, s: 1.0, v: 6 },
    { x: 0.52, y: 0.12, s: 0.7, v: 9 },
    { x: 0.82, y: 0.28, s: 1.2, v: 4 },
  ];
  for (const c of clouds) {
    const x = ((c.x * w + t * c.v) % (w + 200)) - 100;
    const y = c.y * horizon;
    const s = c.s;
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 26 * s, y + 6 * s, 17 * s, 0, Math.PI * 2);
    ctx.arc(x - 24 * s, y + 8 * s, 14 * s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawHarbour(ctx, w, horizon) {
  ctx.save();
  ctx.fillStyle = 'rgba(122,158,192,.45)';
  // crane gantries
  for (const base of [90, 250, 760]) {
    ctx.fillRect(base, horizon - 96, 7, 96);
    ctx.fillRect(base + 46, horizon - 96, 7, 96);
    ctx.fillRect(base - 16, horizon - 104, 104, 9);
    ctx.fillRect(base + 24, horizon - 140, 7, 40);
  }
  // stacked containers on the dock
  const dock = [
    [430, C.purple], [472, C.teal], [514, C.orange], [556, C.whale],
    [451, C.orange], [493, C.purple], [535, C.teal],
  ];
  dock.forEach(([x, color], i) => {
    const row = i < 4 ? 0 : 1;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = color;
    ctx.fillRect(x, horizon - 26 - row * 22, 38, 20);
  });
  ctx.restore();
}

function drawSea(ctx, t, w, h, horizon) {
  const g = ctx.createLinearGradient(0, horizon, 0, h);
  g.addColorStop(0, C.sea);
  g.addColorStop(1, C.seaDark);
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, w, h - horizon);

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 2;
  for (let row = 0; row < 4; row++) {
    const y = horizon + 26 + row * 34;
    const speed = 22 + row * 10;
    const amp = 3 + row;
    ctx.beginPath();
    for (let x = -20; x <= w + 20; x += 12) {
      const yy = y + Math.sin((x + t * speed) / 46) * amp;
      if (x === -20) ctx.moveTo(x, yy);
      else ctx.lineTo(x, yy);
    }
    ctx.globalAlpha = 0.5 - row * 0.08;
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * A Docker-ish shipping container.
 * state: 'idle' | 'booting' | 'busy' | 'ghost'
 */
function drawContainer(ctx, x, y, w, h, color, opts = {}) {
  const { label = '', state = 'idle', progress = 0, badge = '', shadow = true } = opts;
  ctx.save();
  if (shadow) {
    ctx.shadowColor = 'rgba(0,0,0,.28)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;
  }

  /** Name a cause for a test. Wrong accusations cost a life. */
  accuse(rowId, cause) {
    const row = this.rows.find((r) => r.id === rowId);
    if (!row || row.solved || !CAUSES[cause]) return { ok: false };
    row.verdict = cause;
    if (row.cause === cause) {
      row.solved = true;
      this.score += L2.POINTS_CORRECT;
      return { ok: true, correct: true, cause, points: L2.POINTS_CORRECT };
    }
    this.mistakes += 1;
    return { ok: true, correct: false, cause, truth: row.cause, points: 0 };
  }

  /** Unspent CI minutes are worth points; evidence is not free. */
  bonus() {
    return this.rerunsLeft * L2.RERUN_BONUS;
  }
}

function shuffle(items, rng) {
  const out = items.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

/* ================================================================== */
/* Level 3 — Pipe Dream                                                */
/* ================================================================== */

/**
 * Pipes as bitmasks: which sides of a cell are open. Rotating a piece rotates
 * its bits, which is the whole physics of this level.
 */
const DIRS = [
  { name: 'n', bit: 1, dx: 0, dy: -1, back: 4 },
  { name: 'e', bit: 2, dx: 1, dy: 0, back: 8 },
  { name: 's', bit: 4, dx: 0, dy: 1, back: 1 },
  { name: 'w', bit: 8, dx: -1, dy: 0, back: 2 },
];

/** The pieces the generator scatters around the board, as unrotated masks. */
const PIECES = [3, 6, 12, 9, 5, 10, 7, 14, 13, 11];

const L3 = {
  ROUNDS: 3,
  LIVES: 3,
  /** Seconds the water spends filling one cell. */
  FILL_TIME: 0.9,
  POINTS_CONNECT: 250,
  POINTS_PER_DRY: 15,
  BOARDS: [
    { cols: 6, rows: 4, wallX: 3, gates: [1], srcRow: 1, dstRow: 2, lead: 14, port: 5432, service: 'postgres' },
    { cols: 7, rows: 5, wallX: 3, gates: [1, 3], srcRow: 2, dstRow: 1, lead: 13, port: 6379, service: 'redis' },
    { cols: 8, rows: 5, wallX: 4, gates: [2], srcRow: 0, dstRow: 4, lead: 12, port: 9092, service: 'kafka' },
  ],
};

/** Turn a mask a quarter turn clockwise, `times` times. */
function rotate(mask, times = 1) {
  let m = mask & 15;
  const turns = ((times % 4) + 4) % 4;
  for (let i = 0; i < turns; i++) m = ((m << 1) | (m >> 3)) & 15;
  return m;
}

function opens(mask, bit) {
  return (mask & bit) !== 0;
}

function dirOf(bit) {
  return DIRS.find((d) => d.bit === bit);
}

/**
 * The board. The wall between host and Docker network runs down the left edge
 * of column `wallX`, and pipes may only cross it on a gate row — that gate is
 * the published port, and there is no other way in.
 */
class PipeGrid {
  constructor({ cols, rows, wallX, gates, srcRow, dstRow, cells }) {
    this.cols = cols;
    this.rows = rows;
    this.wallX = wallX;
    this.gates = gates.slice();
    this.srcRow = srcRow;
    this.dstRow = dstRow;
    this.cells = cells;
    this.filled = new Set();
    this.flowing = false;
    this.dead = false;
    this.connected = false;
  }

  key(x, y) {
    return y * this.cols + x;
  }

  inside(x, y) {
    return x >= 0 && y >= 0 && x < this.cols && y < this.rows;
  }

  at(x, y) {
    return this.inside(x, y) ? this.cells[this.key(x, y)] : null;
  }

  isFilled(x, y) {
    return this.filled.has(this.key(x, y));
  }

  isGate(y) {
    return this.gates.includes(y);
  }

  /** Does the wall stand between these two horizontally adjacent cells? */
  crossesWall(x, dx) {
    return dx === 1 ? x + 1 === this.wallX : x === this.wallX;
  }

  /** Can water flow out of (x,y) through `bit` into the neighbour? */
  linked(x, y, bit) {
    const dir = dirOf(bit);
    const from = this.at(x, y);
    const to = this.at(x + dir.dx, y + dir.dy);
    if (!from || !to) return false;
    if (!opens(from.mask, bit) || !opens(to.mask, dir.back)) return false;
    if (dir.dy === 0 && this.crossesWall(x, dir.dx) && !this.isGate(y)) return false;
    return true;
  }

  /** Rotating is free, but only while the cell is still dry. */
  rotateAt(x, y, times = 1) {
    const cell = this.at(x, y);
    if (!cell || cell.locked || this.isFilled(x, y)) return false;
    cell.mask = rotate(cell.mask, times);
    cell.turns = (cell.turns || 0) + 1;
    return true;
  }

  /** The test hands its connection to the first cell; it has to be open to it. */
  start() {
    this.flowing = true;
    const entry = this.at(0, this.srcRow);
    if (!entry || !opens(entry.mask, 8)) {
      this.dead = true;
      return false;
    }
    this.filled.add(this.key(0, this.srcRow));
    this.checkArrival();
    return true;
  }

  /** One tick of water: every cell touching the wet set fills at once. */
  advance() {
    if (!this.flowing || this.dead || this.connected) return [];
    const next = [];
    for (const k of this.filled) {
      const x = k % this.cols;
      const y = Math.floor(k / this.cols);
      for (const dir of DIRS) {
        if (!this.linked(x, y, dir.bit)) continue;
        const nk = this.key(x + dir.dx, y + dir.dy);
        if (!this.filled.has(nk) && !next.includes(nk)) next.push(nk);
      }
    }
    if (!next.length) {
      this.dead = true;
      return [];
    }
    for (const k of next) this.filled.add(k);
    this.checkArrival();
    return next.map((k) => ({ x: k % this.cols, y: Math.floor(k / this.cols) }));
  }

  /** The container is reached when wet pipe leaves the last column eastwards. */
  checkArrival() {
    const exit = this.at(this.cols - 1, this.dstRow);
    if (exit && opens(exit.mask, 2) && this.isFilled(this.cols - 1, this.dstRow)) {
      this.connected = true;
    }
  }

  /** Is there a complete route right now, water or no water? */
  hasRoute() {
    const entry = this.at(0, this.srcRow);
    if (!entry || !opens(entry.mask, 8)) return false;
    const seen = new Set([this.key(0, this.srcRow)]);
    const stack = [[0, this.srcRow]];
    while (stack.length) {
      const [x, y] = stack.pop();
      if (x === this.cols - 1 && y === this.dstRow && opens(this.at(x, y).mask, 2)) return true;
      for (const dir of DIRS) {
        if (!this.linked(x, y, dir.bit)) continue;
        const nx = x + dir.dx;
        const ny = y + dir.dy;
        if (seen.has(this.key(nx, ny))) continue;
        seen.add(this.key(nx, ny));
        stack.push([nx, ny]);
      }
    }
    return false;
  }

  /**
   * Optimistic check: is a winning route still reachable by rotating the dry
   * cells? Wet pipe is frozen, so a leak can genuinely lock the player out and
   * we would rather say so than let the clock run down in silence.
   */
  canStillWin() {
    const seen = new Set();
    const stack = [];
    const entry = this.at(0, this.srcRow);
    if (!entry) return false;
    for (const mask of this.options(0, this.srcRow)) {
      if (opens(mask, 8)) stack.push({ x: 0, y: this.srcRow, mask });
    }
    while (stack.length) {
      const at = stack.pop();
      const id = this.key(at.x, at.y) * 16 + at.mask;
      if (seen.has(id)) continue;
      seen.add(id);
      if (at.x === this.cols - 1 && at.y === this.dstRow && opens(at.mask, 2)) return true;
      for (const dir of DIRS) {
        if (!opens(at.mask, dir.bit)) continue;
        if (dir.dy === 0 && this.crossesWall(at.x, dir.dx) && !this.isGate(at.y)) continue;
        const nx = at.x + dir.dx;
        const ny = at.y + dir.dy;
        if (!this.inside(nx, ny)) continue;
        for (const mask of this.options(nx, ny)) {
          if (opens(mask, dir.back)) stack.push({ x: nx, y: ny, mask });
        }
      }
    }
    return false;
  }

  /** Every mask a cell could show: one if the water already froze it, else four. */
  options(x, y) {
    const cell = this.at(x, y);
    if (!cell) return [];
    if (this.isFilled(x, y) || cell.locked) return [cell.mask];
    return [0, 1, 2, 3].map((t) => rotate(cell.mask, t));
  }

  get dry() {
    return this.cols * this.rows - this.filled.size;
  }
}

/**
 * Carve a route from the test to the container through one of the gates, fill
 * the rest of the board with junk pipe, then spin everything out of alignment.
 * Rotation can never destroy the solution, so every board is always solvable.
 */
function buildPipeGrid(spec, rng) {
  const { cols, rows, wallX, gates, srcRow, dstRow } = spec;
  const gate = gates[Math.floor(rng() * gates.length)];
  const route = [
    ...carve({ cols: wallX, rows }, { x: 0, y: srcRow }, { x: wallX - 1, y: gate }, rng),
    ...carve({ cols: cols - wallX, rows }, { x: 0, y: gate }, { x: cols - wallX - 1, y: dstRow }, rng)
      .map((p) => ({ x: p.x + wallX, y: p.y })),
  ];

  const cells = Array.from({ length: cols * rows }, () => ({ mask: 0, solution: 0, turns: 0, route: false }));
  const index = (p) => p.y * cols + p.x;
  route.forEach((p, i) => {
    const cell = cells[index(p)];
    cell.route = true;
    const prev = route[i - 1];
    const next = route[i + 1];
    cell.mask |= prev ? between(p, prev) : 8;          // the test comes in from the west
    cell.mask |= next ? between(p, next) : 2;          // the container is out east
  });

  for (const cell of cells) {
    if (!cell.route) cell.mask = PIECES[Math.floor(rng() * PIECES.length)];
    cell.solution = cell.mask;   // kept for the solver in the tests, never shown
    cell.mask = rotate(cell.mask, Math.floor(rng() * 4));
    cell.turns = 0;
  }

  const grid = new PipeGrid({ ...spec, cells });
  // A board that opens already connected is not a puzzle: nudge one route piece.
  if (grid.hasRoute()) {
    const victim = cells.find((c) => c.route && rotate(c.mask, 1) !== c.mask);
    if (victim) victim.mask = rotate(victim.mask, 1);
  }
  return grid;
}

/** Which way does `b` lie from `a`? */
function between(a, b) {
  return DIRS.find((d) => a.x + d.dx === b.x && a.y + d.dy === b.y).bit;
}

/** A wandering, self-avoiding walk through one side of the board. */
function carve(region, from, to, rng) {
  const seen = new Set([from.y * region.cols + from.x]);
  const path = [from];
  const walk = (at) => {
    if (at.x === to.x && at.y === to.y) return true;
    const options = shuffle(DIRS.slice(), rng).sort((a, b) => pull(at, a, to) - pull(at, b, to));
    for (const dir of options) {
      const next = { x: at.x + dir.dx, y: at.y + dir.dy };
      if (next.x < 0 || next.y < 0 || next.x >= region.cols || next.y >= region.rows) continue;
      const k = next.y * region.cols + next.x;
      if (seen.has(k)) continue;
      seen.add(k);
      path.push(next);
      if (walk(next)) return true;
      path.pop();
      seen.delete(k);
    }
    return false;
  };
  walk(from);
  return path;
}

/** Prefer steps that head for the exit, but not so strongly that it is a straight line. */
function pull(at, dir, to) {
  const dx = to.x - at.x;
  const dy = to.y - at.y;
  return -(dir.dx * Math.sign(dx) + dir.dy * Math.sign(dy));
}



/* ================================================================== */
/* Level 4 — Ryuk                                                      */
/* ================================================================== */

/**
 * The host, as a maze. '#' is something you cannot walk through — a daemon
 * socket, a bind mount, another job's workspace — and '.' is free floor.
 */
const HOSTS = [
  [
    '#################',
    '#...............#',
    '#.##.##...##.##.#',
    '#.#...#...#...#.#',
    '#...#.......#...#',
    '#.#...#...#...#.#',
    '#.##.##...##.##.#',
    '#...............#',
    '#################',
  ],
  [
    '#################',
    '#...#.......#...#',
    '#.#.#.#####.#.#.#',
    '#.#.....#.....#.#',
    '#.#####.#.#####.#',
    '#.#.....#.....#.#',
    '#.#.#.#####.#.#.#',
    '#...#.......#...#',
    '#################',
  ],
  [
    '#################',
    '#.....#...#.....#',
    '###.#.#.#.#.#.###',
    '#...#...#...#...#',
    '#.#####.#.#####.#',
    '#...#...#...#...#',
    '###.#.#.#.#.#.###',
    '#.....#...#.....#',
    '#################',
  ],
];

/** What Testcontainers leaves behind, and what Ryuk is allowed to take. */
const SPOILS = [
  { kind: 'container', short: 'C', label: 'container' },
  { kind: 'network', short: 'N', label: 'network' },
  { kind: 'volume', short: 'V', label: 'volume' },
];

const L4 = {
  ROUNDS: 3,
  LIVES: 3,
  POINTS_ITEM: 60,
  POINTS_PER_SECOND: 4,
  /**
   * Seconds per cell. The strays are deliberately slower than you. A maze this
   * dense puts a junction every cell or two, so the step is also the window you
   * get to decide at each one: at 0.13 the level was reflex, not routing.
   */
  STEP: 0.2,
  STRAY_STEP: 0.34,
  /** Clocks are sized for the slower pace — roughly 1.5x the old budgets. */
  BOARDS: [
    { host: 0, mine: 12, theirs: 3, strays: 1, seconds: 70 },
    { host: 1, mine: 14, theirs: 4, strays: 2, seconds: 78 },
    { host: 2, mine: 16, theirs: 5, strays: 3, seconds: 85 },
  ],
};

/** A four-hex session id, the label Ryuk actually matches on. */
function sessionId(rng) {
  const hex = '0123456789abcdef';
  let out = '';
  for (let i = 0; i < 4; i++) out += hex[Math.floor(rng() * 16)];
  return out;
}

/**
 * One host to clean up. The reaper walks the maze, takes everything carrying
 * its own session label and must leave every other label alone.
 */
class HostBoard {
  constructor({ rng, host, mine, theirs, strays, seconds } = {}) {
    const plan = HOSTS[host];
    this.rows = plan.length;
    this.cols = plan[0].length;
    this.walls = new Set();
    this.floor = [];
    plan.forEach((line, y) => {
      [...line].forEach((char, x) => {
        if (char === '#') this.walls.add(this.key(x, y));
        else this.floor.push({ x, y });
      });
    });

    this.session = sessionId(rng);
    this.left = seconds;
    this.reaped = 0;
    this.mistakes = 0;
    this.over = false;

    // Every other build on this host gets a label of its own, and none of them
    // may collide with yours: the whole level is "does this string match mine".
    const used = new Set([this.session]);
    const foreign = () => {
      let id = sessionId(rng);
      while (used.has(id)) id = sessionId(rng);
      used.add(id);
      return id;
    };

    const open = shuffle(this.floor.slice(), rng);
    this.reaper = { ...open.pop(), dir: null, next: null };
    this.items = [];
    for (let i = 0; i < mine; i++) {
      const at = open.pop();
      if (at) this.items.push({ ...at, kind: SPOILS[i % SPOILS.length].kind, mine: true, taken: false });
    }
    // Somebody else's resource is a tile you must not step on, so it can never
    // sit in the one corridor that leads somewhere: park them where removing
    // the tile still leaves the whole host walkable.
    const blocked = new Set();
    for (let i = 0; i < theirs; i++) {
      const spot = open.findIndex((at) => {
        blocked.add(this.key(at.x, at.y));
        const fine = this.walkable(blocked);
        blocked.delete(this.key(at.x, at.y));
        return fine;
      });
      if (spot < 0) break;
      const at = open.splice(spot, 1)[0];
      blocked.add(this.key(at.x, at.y));
      this.items.push({
        ...at, kind: SPOILS[(i + 1) % SPOILS.length].kind, mine: false, taken: false, session: foreign(),
      });
    }
    this.strays = [];
    for (let i = 0; i < strays; i++) {
      const at = open.pop();
      if (at) this.strays.push({ ...at, dir: DIRS[Math.floor(rng() * 4)], session: foreign() });
    }
    this.rng = rng;
  }

  key(x, y) {
    return y * this.cols + x;
  }

  isWall(x, y) {
    return x < 0 || y < 0 || x >= this.cols || y >= this.rows || this.walls.has(this.key(x, y));
  }

  /** Can every floor tile still be reached if these tiles were off limits? */
  walkable(blocked) {
    const free = this.floor.filter((at) => !blocked.has(this.key(at.x, at.y)));
    if (!free.length) return false;
    const seen = new Set([this.key(free[0].x, free[0].y)]);
    const stack = [free[0]];
    while (stack.length) {
      const at = stack.pop();
      for (const dir of DIRS) {
        const nx = at.x + dir.dx;
        const ny = at.y + dir.dy;
        const id = this.key(nx, ny);
        if (this.isWall(nx, ny) || blocked.has(id) || seen.has(id)) continue;
        seen.add(id);
        stack.push({ x: nx, y: ny });
      }
    }
    return seen.size === free.length;
  }

  /** Step the reaper one cell. Returns what it walked into. */
  moveReaper(dir) {
    const nx = this.reaper.x + dir.dx;
    const ny = this.reaper.y + dir.dy;
    if (this.isWall(nx, ny)) return { moved: false };
    this.reaper.prev = { x: this.reaper.x, y: this.reaper.y };
    this.reaper.x = nx;
    this.reaper.y = ny;
    this.reaper.dir = dir;
    return { moved: true, ...this.reap(nx, ny) };
  }

  /** Take whatever is under the reaper — including what it should not have. */
  reap(x, y) {
    const item = this.items.find((i) => !i.taken && i.x === x && i.y === y);
    if (!item) return {};
    item.taken = true;
    if (item.mine) {
      this.reaped += 1;
      if (this.remaining === 0) this.over = true;
      return { item, hit: false };
    }
    this.mistakes += 1;
    return { item, hit: true };
  }

  /** Strays keep going until the wall stops them, then pick a new way. */
  stepStrays() {
    for (const stray of this.strays) {
      const options = DIRS.filter((d) => !this.isWall(stray.x + d.dx, stray.y + d.dy));
      if (!options.length) continue;
      const straight = options.filter((d) => d !== dirOf(stray.dir.back));
      const pool = straight.length ? straight : options;
      const ahead = pool.includes(stray.dir);
      // Hold the line most of the time; a junction is a coin toss.
      const dir = ahead && this.rng() < 0.7 ? stray.dir : pool[Math.floor(this.rng() * pool.length)];
      stray.dir = dir;
      stray.x += dir.dx;
      stray.y += dir.dy;
    }
  }

  /**
   * Did a stray land on the reaper, or swap places with it? Pass the strays'
   * positions from before the step to catch the two walking through each other.
   */
  strayHit(before = []) {
    const here = this.reaper;
    const prev = here.prev;
    return this.strays.some((stray, i) => {
      if (stray.x === here.x && stray.y === here.y) return true;
      const was = before[i];
      if (!was || !prev) return false;
      return was.x === here.x && was.y === here.y && stray.x === prev.x && stray.y === prev.y;
    });
  }

  tick(dt) {
    if (this.over) return false;
    this.left = Math.max(0, this.left - dt);
    return this.left === 0;
  }

  get remaining() {
    return this.items.filter((i) => i.mine && !i.taken).length;
  }

  get bonus() {
    return Math.round(this.left) * L4.POINTS_PER_SECOND;
  }
}

/** Every floor tile has to be walkable from every other one. */
function hostIsConnected(plan) {
  const rows = plan.length;
  const cols = plan[0].length;
  const floor = [];
  plan.forEach((line, y) => [...line].forEach((char, x) => {
    if (char !== '#') floor.push(`${x},${y}`);
  }));
  if (!floor.length) return false;
  const seen = new Set([floor[0]]);
  const stack = [floor[0].split(',').map(Number)];
  while (stack.length) {
    const [x, y] = stack.pop();
    for (const dir of DIRS) {
      const nx = x + dir.dx;
      const ny = y + dir.dy;
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      if (plan[ny][nx] === '#') continue;
      const id = `${nx},${ny}`;
      if (seen.has(id)) continue;
      seen.add(id);
      stack.push([nx, ny]);
    }
  }
  return seen.size === floor.length;
}

function unlockAfter(levelId, won) {
  if (!won) return levelId;
  return Math.min(LEVELS.length, levelId + 1);
}

function totalScore(best) {
  return LEVELS.reduce((sum, level) => sum + (best[level.id] || 0), 0);
}

/**
 * Fixed-timestep game loop, canvas scaling and input plumbing.
 * Scenes implement: enter(engine), update(dt), draw(ctx), exit().

const MAX_FRAME = 0.25;

  constructor(canvas, engine) {
    this.canvas = canvas;
    this.engine = engine;
    /** @type {Set<string>} keys currently held */
    this.held = new Set();
    /** @type {string[]} keys pressed since the last update */
    this.presses = [];
    /** @type {{x:number,y:number}[]} taps since the last update */
    this.taps = [];

    this._onKeyDown = (e) => {
      if (e.repeat) return;
      const code = normalise(e.code);
      if (!code) return;
      if (code === 'Space' || code.startsWith('Arrow')) e.preventDefault();
      this.held.add(code);
      this.presses.push(code);
    };
    this._onKeyUp = (e) => this.held.delete(normalise(e.code));
    this._onBlur = () => this.held.clear();
    this._onPointer = (e) => {
      const r = canvas.getBoundingClientRect();
      if (!r.width || !r.height) return;
      this.taps.push({
        x: ((e.clientX - r.left) / r.width) * VIEW.w,
        y: ((e.clientY - r.top) / r.height) * VIEW.h,
        touch: e.pointerType !== 'mouse',
      });
      canvas.focus({ preventScroll: true });
    };

    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
    window.addEventListener('blur', this._onBlur);
    canvas.addEventListener('pointerdown', this._onPointer);
  }

  /** Feed a synthetic key press (used by the on-screen touch buttons). */
  virtualPress(code) {
    this.presses.push(code);
    this.held.add(code);
  }

  virtualRelease(code) {
    this.held.delete(code);
  }

  isHeld(code) {
    return this.held.has(code);
  }

  takePresses() {
    const out = this.presses;
    this.presses = [];
    return out;
  }

  takeTaps() {
    const out = this.taps;
    this.taps = [];
    return out;
  }

  clear() {
    this.held.clear();
    this.presses.length = 0;
    this.taps.length = 0;
  }
}

    const h = Math.round(VIEW.h * dpr);

    ctx.strokeStyle = wet ? C.sea : 'rgba(247,241,227,.7)';

/** The three things Testcontainers leaves behind, drawn small enough to litter. */
function drawSpoil(ctx, kind, cx, cy, size, color, mine) {

  ctx.strokeStyle = mine ? C.cream : 'rgba(247,241,227,.45)';
  ctx.fillStyle = color;
  ctx.globalAlpha = mine ? 1 : 0.55;

    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(8,26,46,.5)';
    for (const off of [-0.18, 0.18]) {
      ctx.moveTo(cx + s * off, cy - s * 0.26);
      ctx.lineTo(cx + s * off, cy + s * 0.26);
    }

    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.36, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / 3;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * s * 0.36, cy + Math.sin(a) * s * 0.36, s * 0.13, 0, Math.PI * 2);

    ctx.ellipse(cx, cy - s * 0.24, s * 0.34, s * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - s * 0.34, cy - s * 0.24, s * 0.68, s * 0.48);
    ctx.beginPath();
    ctx.ellipse(cx, cy + s * 0.24, s * 0.34, s * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

/** A build that has not finished yet, still wandering the host. */
function drawGhost(ctx, cx, cy, size, color, t) {
  const r = size * 0.42;
  const bob = Math.sin(t * 4) * 1.5;
  ctx.save();
  ctx.translate(cx, cy + bob);
  ctx.beginPath();
  ctx.arc(0, 0, r, Math.PI, 0);
  ctx.lineTo(r, r * 0.7);

    ctx.quadraticCurveTo(x, r * 1.25, x - r / 3, r * 0.7);

  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = C.navyDeep;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  for (const off of [-r * 0.36, r * 0.36]) {
    ctx.beginPath();
    ctx.arc(off, -r * 0.15, r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = C.cream;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(off, -r * 0.15, r * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = C.navyDeep;
    ctx.fill();
  }
  ctx.restore();
}

  for (const word of String(str).split(' ')) {
